services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: causalmark-backend
    plan: free
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "PYTHONPATH=.:src uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: causalmark-frontend
    plan: free
    runtime: node
    rootDir: web-app
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        value: https://causalmark-backend.onrender.com
